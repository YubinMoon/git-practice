name: Push Issue Example
on: push
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Create Comment with GitHub CLI
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "create issue from push" \
            --body "this issue is created by actions"
